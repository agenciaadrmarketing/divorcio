<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prévia mobile — Golpe do Pix</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1a1a; font-family: system-ui, sans-serif; }
  .palco { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 16px 40px; box-sizing: border-box; }
  .rotulo { color: #9A9A9A; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  .telefone { width: 390px; height: 844px; border-radius: 44px; border: 10px solid #000; background: #000; box-shadow: 0 30px 80px rgba(0,0,0,.6); overflow: hidden; position: relative; }
  .telefone iframe { width: 390px; height: 844px; border: 0; display: block; background: #0B0B0B; }
  .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 150px; height: 26px; background: #000; border-radius: 0 0 16px 16px; z-index: 2; pointer-events: none; }
</style>
</head>
<body>
  <div class="palco">
    <div class="rotulo">iPhone 14 · 390 × 844</div>
    <div class="telefone">
      <div class="notch"></div>
      <iframe src="Landing Golpe do Pix.dc.html" title="Prévia mobile"></iframe>
    </div>
  </div>
</body>
</html>
