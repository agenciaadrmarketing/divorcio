<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botão CTA com brilho — exportado do site ADR Marketing</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
    background: #0d0d0d;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* ================================================================
     BOTÃO "BRILHO" — copie este bloco inteiro (@property + .brilho +
     @keyframes + @media reduced-motion) para o <style> da outra LP.
     Não depende de nenhum framework nem JS: é CSS puro.
     ================================================================ */

  @property --ang     { syntax: "<angle>";      initial-value: 0deg;    inherits: false; }
  @property --angOff  { syntax: "<angle>";      initial-value: 0deg;    inherits: false; }
  @property --pct     { syntax: "<percentage>"; initial-value: 5%;      inherits: false; }
  @property --shine   { syntax: "<color>";      initial-value: #ffffff; inherits: false; }

  .brilho {
    /* troque --bg/--luz/--luzSuave para adaptar a cor à outra marca */
    --bg: #1a9646;
    --luz: #4ade80;
    --luzSuave: #a7f3c4;
    --dur: 3s;
    --trans: 800ms cubic-bezier(.25,1,.5,1);
    isolation: isolate;
    position: relative;
    overflow: hidden;
    outline-offset: 4px;
    border: 1px solid transparent !important;
    color: #ffffff;
    background:
      linear-gradient(var(--bg), var(--bg)) padding-box,
      conic-gradient(from calc(var(--ang) - var(--angOff)),
        transparent,
        var(--luz) var(--pct),
        var(--shine) calc(var(--pct) * 2),
        var(--luz) calc(var(--pct) * 3),
        transparent calc(var(--pct) * 4)) border-box !important;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18), 0 8px 22px -12px rgba(26,150,70,0.5);
    transition:
      --angOff 700ms cubic-bezier(.22,1,.36,1),
      --pct 700ms cubic-bezier(.22,1,.36,1),
      --shine 700ms cubic-bezier(.22,1,.36,1),
      transform 420ms cubic-bezier(.22,1,.36,1),
      box-shadow 420ms cubic-bezier(.22,1,.36,1);
    will-change: transform;

    /* estilo base do botão em si — ajuste livremente */
    display: inline-flex;
    align-items: center;
    gap: 11px;
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    padding: 0 32px;
    height: 54px;
    border-radius: 999px;
    cursor: pointer;
  }

  /* sparkles (pontinhos) que giram na borda */
  .brilho::before, .brilho::after {
    content: "";
    pointer-events: none;
    position: absolute;
    left: 50%; top: 50%;
    translate: -50% -50%;
    z-index: -1;
  }
  .brilho::before {
    width: calc(100% - 6px);
    height: calc(100% - 6px);
    border-radius: inherit;
    background: radial-gradient(circle at 2px 2px, #fff .5px, transparent 0) padding-box;
    background-size: 4px 4px;
    background-repeat: space;
    mask-image: conic-gradient(from calc(var(--ang) + 45deg), #000, transparent 10% 90%, #000);
    -webkit-mask-image: conic-gradient(from calc(var(--ang) + 45deg), #000, transparent 10% 90%, #000);
    opacity: .38;
    transition: opacity 420ms cubic-bezier(.22,1,.36,1);
  }
  /* sweep de luz diagonal */
  .brilho::after {
    width: 100%;
    aspect-ratio: 1;
    background: linear-gradient(-50deg, transparent, var(--luz), transparent);
    mask-image: radial-gradient(circle at bottom, transparent 40%, #000);
    -webkit-mask-image: radial-gradient(circle at bottom, transparent 40%, #000);
    opacity: .5;
    transition: opacity 420ms cubic-bezier(.22,1,.36,1);
  }
  .brilho > * { position: relative; z-index: 1; }

  .brilho, .brilho::before, .brilho::after {
    animation: brilhoAng var(--dur) linear infinite,
               brilhoAng calc(var(--dur) / .4) linear infinite reverse paused;
    animation-composition: add;
  }
  .brilho::after {
    animation: brilhoGira var(--dur) linear infinite,
               brilhoGira calc(var(--dur) / .4) linear infinite reverse paused;
  }

  /* hover / focus: acelera o giro e "levanta" o botão */
  .brilho:is(:hover, :focus-visible) {
    --pct: 20%;
    --angOff: 95deg;
    --shine: var(--luzSuave);
    transform: translateY(-3px) scale(1.02);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18), 0 0 0 3px rgba(26,150,70,0.16), 0 16px 36px -12px rgba(26,150,70,0.65);
    transition-duration: 260ms, 260ms, 260ms, 300ms, 300ms;
  }
  .brilho:is(:hover, :focus-visible),
  .brilho:is(:hover, :focus-visible)::before,
  .brilho:is(:hover, :focus-visible)::after { animation-play-state: running; }
  .brilho:is(:hover, :focus-visible)::before { opacity: .5; }
  .brilho:is(:hover, :focus-visible)::after { opacity: .68; }
  .brilho:active { transform: translateY(0) scale(.99); transition-duration: 90ms; }

  @keyframes brilhoAng  { to { --ang: 360deg; } }
  @keyframes brilhoGira { to { rotate: 360deg; } }

  /* respeita quem pediu menos animação no sistema */
  @media (prefers-reduced-motion: reduce) {
    .brilho, .brilho::before, .brilho::after { animation: none !important; }
    .brilho::before, .brilho::after { display: none; }
  }

  /* ================================================================
     Fim do bloco a copiar.
     ================================================================ */

  .legenda {
    color: #8a8a8a;
    font-size: 13px;
    text-align: center;
    margin-top: 14px;
  }
  .bloco { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>

  <div class="bloco">
    <button class="brilho" type="button">Falar agora</button>
    <p class="legenda">exemplo 1 — pill, como no header</p>
  </div>

  <div class="bloco">
    <button class="brilho" type="button" style="height:40px; font-size:12px; padding:0 20px">Solicitar diagnóstico</button>
    <p class="legenda">exemplo 2 — versão compacta</p>
  </div>

  <div class="bloco">
    <button class="brilho" type="button" style="--bg:#2563eb; --luz:#60a5fa; --luzSuave:#bfdbfe; height:54px; padding:0 32px">
      Quero saber mais
    </button>
    <p class="legenda">exemplo 3 — mesma animação, cor azul</p>
  </div>

</body>
</html>
